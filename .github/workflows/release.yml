# Publish the public @jsvision packages to npm, in lockstep, with provenance.
#
# A merged pull request targeting master triggers this workflow automatically.
# Versioning is owned by @blendsdk/lockstep: it analyses conventional commits since the
# last tag, bumps every public package to one shared version, and drafts the changelog
# (OpenAI primary, Anthropic fallback). This workflow adds the pieces lockstep leaves to
# the project: a full `yarn verify` gate BEFORE releasing, syncing each package's exported
# VERSION constant to the bumped manifests, a rebuild so the published dist carries the
# new version, a single release commit + tag, and a public GitHub Release announcement.
#
# Only @jsvision/core, @jsvision/ui, @jsvision/i18n, @jsvision/files,
# @jsvision/datagrid, @jsvision/code-editor, and @jsvision/forms are public; every
# other workspace (including @jsvision/web, which stays internal for now) is
# `private` and npm skips it. Provenance requires the id-token permission and a
# `repository` field in each published package (both satisfied here).
#
name: Release

on:
  # `pull_request_target` runs in the trusted base-repository context, so a merged pull request
  # from a fork can release without exposing write credentials to the pull request's code.
  pull_request_target:
    branches: [master]
    types: [closed]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      RELEASE_DIST_TAG: latest
    permissions:
      contents: write # push the release commit + tag
      id-token: write # npm provenance (OIDC)
    steps:
      - name: Checkout (full history for conventional-commit analysis)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify (lint + typecheck + build + tests + docs guards)
        run: yarn verify

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Prepare the release version and derived artifacts
        run: yarn release:prepare
        env:
          # AI-drafted changelog notes: OpenAI primary, Anthropic fallback. With no
          # key, lockstep writes deterministic fallback entries and still proceeds.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOCKSTEP_OPENAI_MODEL: ${{ secrets.LOCKSTEP_OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Rebuild so published dist carries the new version
        run: yarn build

      - name: Commit + tag the release
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          git add -A
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag "v${VERSION}"

      - name: Publish to npm (lockstep, provenance, push the release commit)
        # Run lockstep by putting node_modules/.bin on PATH and calling it directly,
        # NOT via `yarn lockstep`. `yarn` forces npm_config_registry=registry.yarnpkg.com
        # onto its child processes, which the spawned `npm publish` would then target —
        # but the auth token setup-node wrote is scoped to registry.npmjs.org, so the
        # publish would fail auth against the yarn mirror. Calling lockstep directly keeps
        # the clean npmjs.org env (from .npmrc + npm_config_registry below).
        run: |
          export PATH="$(pwd)/node_modules/.bin:$PATH"
          lockstep publish --tag "$RELEASE_DIST_TAG" --git-push --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          npm_config_registry: 'https://registry.npmjs.org/'

      # `--git-push` pushes the release BRANCH; the tag created above lives only in the
      # runner and dies with it unless pushed explicitly. Both v0.2.0 and v1.0.0 were lost
      # exactly this way — the release commits are on master, the tags never existed
      # anywhere. Re-pushing a tag that is already on the remote is a no-op, so this is
      # safe to re-run, and it deliberately does NOT tolerate failure: an untagged release
      # is the bug being fixed.
      - name: Push the version tag
        id: push_version_tag
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          git push origin "v${VERSION}"

      # A GitHub Release is the repository's public announcement channel. GitHub
      # generates the merged-PR summary, contributor list, and full comparison link;
      # release preparation has already written the AI-assisted package changelogs.
      - name: Publish the GitHub Release
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^)
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "JSVision v${VERSION}" \
            --generate-notes \
            --notes-start-tag "${PREVIOUS_TAG}" \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      # Release preparation changes versions, changelogs, and generated references on
      # master after the release pull request has merged. Bring those exact changes back
      # to the latest develop branch so subsequent work starts from the published state.
      # A conflicting merge or a concurrent push rejects this step without overwriting
      # remote work; both cases require a normal human conflict resolution or rerun. Run
      # this even if only the announcement failed because npm and the tag are already public.
      - name: Sync release changes back to develop
        if: ${{ always() && steps.push_version_tag.outcome == 'success' }}
        run: |
          git fetch origin master develop
          git switch --force-create develop origin/develop
          git merge --no-edit origin/master
          git push origin develop
